<body class="bg-ink font-sans text-slate-200 antialiased" data-page="login">
  <a href="#main" class="skip-link">Перейти до вмісту</a>

  <main id="main" class="login-shell" style="background-image:url('assets/img/login-office.jpg')">
    <div class="login-card">
      <div class="mb-6 flex items-center gap-2.5">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-slate-950 shadow-lg shadow-sky-500/20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
            <path d="M4 14.5h2.6l2.2-5.2 3.4 8.6 2.4-5.6H20"/>
          </svg>
        </span>
        <span class="text-lg font-bold tracking-tight text-slate-50">Insight</span>
      </div>
      <h1 class="text-xl font-bold text-slate-50">Вхід у дашборд</h1>
      <p class="mt-1 text-sm text-slate-400">Демо-форма для портфоліо — дані не надсилаються</p>

      <form id="loginForm" class="mt-6 space-y-4" novalidate>
        <div class="field">
          <label for="loginEmail">Пошта</label>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="iryna.koval@insight-bi.app" required>
        </div>
        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-2.5 text-sm">Увійти</button>
      </form>

      <p class="mt-6 text-center text-xs text-slate-500">
        <a href="index.html" class="font-medium text-brand transition hover:text-sky-300">← Повернутися на дашборд</a>
      </p>
      <p class="mt-3 text-center text-xs text-slate-600">
        <a href="credits.html" class="hover:text-slate-400">Фото: автори та ліцензії</a> · <a href="../../index.html#projects" class="hover:text-slate-400">До портфоліо</a>
      </p>
    </div>
  </main>
